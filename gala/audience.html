<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audience Screen · Aspiring Futures</title>
<link rel="icon" href="assets/aspiring-futures-logo.jpg">
<link rel="stylesheet" href="ds/fonts.css">
<link rel="stylesheet" href="ds/styles.css">
<style>
:root {
  --color-bg: #0e0b26;
  --color-surface: #1b1442;
  --color-text: #f7f4ef;
  --color-accent: #f2a93b;
  --color-accent-2: #9563dc;
  --color-divider: color-mix(in srgb, #f7f4ef 18%, transparent);
  --color-neutral-100: #f7f5fb; --color-neutral-200: #e6e1f0; --color-neutral-300: #c9c1de;
  --color-neutral-400: #a79cc4; --color-neutral-500: #8478a6; --color-neutral-600: #635886;
  --color-neutral-700: #453c63; --color-neutral-800: #2a2347; --color-neutral-900: #16102f;
  --color-accent-100: #fdf3e0; --color-accent-200: #fbe4b8; --color-accent-300: #f8ce84;
  --color-accent-400: #f5b856; --color-accent-500: #f2a93b; --color-accent-600: #d18c25;
  --color-accent-700: #a96c17; --color-accent-800: #7c4e0e; --color-accent-900: #4f3108;
  --color-accent-2-100: #f3ebfc; --color-accent-2-200: #e2d0f8; --color-accent-2-300: #c9a9f1;
  --color-accent-2-400: #ae83e8; --color-accent-2-500: #9563dc; --color-accent-2-600: #7a46c2;
  --color-accent-2-700: #5e31a0; --color-accent-2-800: #43217a; --color-accent-2-900: #2a1450;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.45);
  --shadow-md: 0 6px 18px rgba(0,0,0,.5);
  --shadow-lg: 0 18px 48px rgba(0,0,0,.6);
}
html, body { margin: 0; background: var(--color-bg); }
a { color: var(--color-accent-400); }
a:hover { color: var(--color-accent-300); }
@keyframes afRise { from { opacity: 0; transform: translateY(52px) } to { opacity: 1; transform: none } }
@keyframes afRiseSm { from { opacity: 0; transform: translateY(16px) } to { opacity: 1; transform: none } }
@keyframes afFade { from { opacity: 0 } to { opacity: 1 } }
@keyframes afPop { 0% { opacity: 0; transform: scale(.78) } 62% { opacity: 1; transform: scale(1.05) } 100% { opacity: 1; transform: scale(1) } }
@keyframes afGrow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
@keyframes afRing { 0% { opacity: 0; transform: scale(.5) } 30% { opacity: .5 } 100% { opacity: 0; transform: scale(2) } }
@keyframes afDrop { from { opacity: 0; transform: translateY(-30px) } to { opacity: 1; transform: none } }
@keyframes afGlow { 0%,100% { opacity: .45; transform: scale(1) } 50% { opacity: .8; transform: scale(1.06) } }
@keyframes afSpark { 0% { opacity: 0; transform: translateY(30px) scale(.3) } 25% { opacity: 1 } 100% { opacity: 0; transform: translateY(-560px) scale(1.1) } }
@keyframes afSurge { 0% { opacity: 0 } 30% { opacity: .85 } 100% { opacity: 0 } }
@keyframes afTubePulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--color-accent-500) 0%, transparent) } 50% { box-shadow: 0 0 0 14px color-mix(in srgb, var(--color-accent-500) 22%, transparent) } }
@keyframes afCapIn { 0% { opacity: 0; transform: translateY(22px) scale(.9) } 60% { opacity: 1; transform: translateY(0) scale(1.06) } 100% { opacity: 1; transform: none } }
@keyframes afCardIn { 0% { opacity: 0; transform: translateY(26px) scale(.93) } 62% { opacity: 1; transform: translateY(0) scale(1.02) } 100% { transform: none } }
@keyframes afCardOut { from { opacity: 1 } to { opacity: 0; transform: translateY(-14px) scale(.97) } }
@keyframes afGoalHero { 0% { opacity: 0; transform: scale(.72) } 10% { opacity: 1; transform: scale(1.06) } 18% { transform: scale(1) } 62% { opacity: 1; transform: scale(1) } 100% { opacity: 0; transform: translate(819px,-449px) scale(.2) } }
@keyframes afGoalBackdrop { 0% { opacity: 0 } 12% { opacity: 1 } 62% { opacity: 1 } 100% { opacity: 0 } }
</style>
<style>html, body { height: 100%; } #dc-root { height: 100%; }</style>
</head>
<body>
<div id="dc-root"></div>
<template id="tpl">
<div ref="{{ setRoot }}" style="position: relative; width: 100%; height: {{ rootHeight }}; overflow: hidden; background: var(--color-bg); font-family: var(--font-body); color: var(--color-text)">

<sc-if value="{{ needsPairing }}">
  <div style="position: absolute; inset: 0; z-index: 20; background: var(--color-bg); display: flex; align-items: center; justify-content: center; padding: 40px; box-sizing: border-box">
    <div style="position: absolute; right: -200px; top: -180px; width: 620px; height: 620px; border-radius: 999px; background: radial-gradient(circle, var(--theme-glow, #5e31a0) 0%, color-mix(in srgb, var(--color-accent-2-500) 0%, transparent) 70%)"></div>
    <div style="position: relative; width: 100%; max-width: 560px; background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: 32px; padding: 40px">
      <img src="assets/fundraising-mark.svg" alt="Fundraising Display" style="width: 68px; height: 68px; border-radius: 20px; object-fit: contain">
      <div style="font-family: var(--font-heading); font-size: 34px; line-height: 1.1; margin-top: 22px">Pair with the recording laptop</div>
      <div style="font-size: 17px; color: var(--color-neutral-300); margin-top: 12px; text-wrap: pretty">Type the four-digit code shown in the portable app. Both laptops must be on the same trusted Wi-Fi. No internet is needed.</div>
      <input type="text" inputmode="numeric" placeholder="1234" autocomplete="off" spellcheck="false" value="{{ codeDraft }}" onChange="{{ onCodeDraft }}" onKeyDown="{{ onCodeKey }}" style="width: 100%; box-sizing: border-box; margin-top: 26px; border-radius: 999px; padding: 18px 26px; font-family: var(--font-heading); font-size: 46px; letter-spacing: 0.5em; text-indent: 0.5em; text-align: center; background: var(--color-neutral-900); border: 1px solid var(--color-divider); color: var(--color-text); outline: none">
      <button onClick="{{ connectCode }}" style="width: 100%; margin-top: 16px; cursor: pointer; border: 0; border-radius: 999px; padding: 18px; font-family: var(--font-heading); font-size: 20px; background: var(--color-accent-500); color: var(--on-primary, #20102f)">Connect</button>
      <sc-if value="{{ pairError }}">
        <div style="font-size: 15px; color: var(--color-accent-300); margin-top: 14px">{{ pairError }}</div>
      </sc-if>
      <button onClick="{{ useLocal }}" style="width: 100%; margin-top: 10px; cursor: pointer; background: transparent; border: 1px solid var(--color-divider); border-radius: 999px; padding: 14px; font-family: var(--font-heading); font-size: 15px; color: var(--color-neutral-300)">Both windows are on this one laptop</button>
    </div>
  </div>
</sc-if>

<sc-if value="{{ linkChip }}">
  <div style="position: absolute; left: 18px; top: 18px; z-index: 12; display: flex; align-items: center; gap: 9px; padding: 8px 16px; border-radius: 999px; background: color-mix(in srgb, var(--color-bg) 86%, transparent); border: 1px solid var(--color-divider)">
    <div style="width: 9px; height: 9px; border-radius: 999px; background: {{ linkChipColor }}"></div>
    <span style="font-size: 13px; font-weight: 700; color: var(--color-neutral-200)">{{ linkChip }}</span>
  </div>
</sc-if>

<div ref="{{ setFrame }}" style="position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: center center; transform: {{ frameTransform }}">

  <div style="position: absolute; right: -300px; top: -280px; width: 860px; height: 860px; border-radius: 999px; background: radial-gradient(circle, var(--theme-glow, #5e31a0) 0%, color-mix(in srgb, var(--color-accent-2-500) 0%, transparent) 70%); animation: afGlow 9s ease-in-out infinite"></div>
  <div style="position: absolute; left: -240px; bottom: -320px; width: 720px; height: 720px; border-radius: 999px; background: radial-gradient(circle, var(--theme-warm-glow, #7c4e0e) 0%, rgba(124,78,14,0) 70%); opacity: .75"></div>

  <div style="position: absolute; left: 0; top: 0; bottom: 0; right: 236px; padding: 60px 40px 56px 72px; display: flex; gap: 44px; box-sizing: border-box; opacity: {{ ambientOpacity }}; transition: opacity .6s ease">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 28px; min-width: 0">

      <div style="display: flex; align-items: center; gap: 24px">
        <sc-if value="{{ logoVisible }}"><img src="{{ logoSrc }}" alt="{{ organization }}" style="width: 150px; height: 98px; flex: none; border-radius: 16px; object-fit: contain"></sc-if>
        <div style="min-width: 0">
          <div style="font-family: var(--font-heading); font-size: 42px; line-height: 1.05; letter-spacing: -0.015em; overflow-wrap: anywhere; max-height: 132px; overflow: hidden">{{ eventName }}</div>
          <div style="font-size: 20px; margin-top: 7px; color: var(--color-neutral-300); max-height: 60px; overflow: hidden">{{ tagline }}</div>
        </div>
      </div>

      <div style="display: flex; align-items: flex-end; gap: 44px">
        <sc-if value="{{ showTotal }}" hint-placeholder-val="{{ true }}">
          <div>
            <div style="font-size: 19px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--color-accent-400)">Raised tonight</div>
            <div style="font-family: var(--font-heading); font-size: 132px; line-height: 1; letter-spacing: -0.03em; color: var(--color-accent-500); margin-top: 6px" data-count="money" data-dur="1600" data-to="{{ total }}">$0</div>
          </div>
        </sc-if>
        <sc-if value="{{ hideTotal }}">
          <div>
            <div style="font-size: 19px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--color-accent-400)">Tonight, together</div>
            <div style="font-family: var(--font-heading); font-size: 60px; line-height: 1.04; letter-spacing: -0.02em; max-width: 780px; margin-top: 10px; max-height: 190px; overflow: hidden">{{ missionMessage }}</div>
          </div>
        </sc-if>
        <div style="padding-bottom: 18px">
          <div style="font-family: var(--font-heading); font-size: 48px; line-height: 1; color: var(--color-accent-2-300)" data-count="int" data-dur="900" data-to="{{ giftCount }}">0</div>
          <div style="font-size: 18px; color: var(--color-neutral-400); margin-top: 5px">gifts so far</div>
        </div>
      </div>

      <div style="display: flex; gap: 18px; align-items: stretch">
        <sc-for list="{{ cats }}" as="c" hint-placeholder-count="4">
          <div style="flex: 1; min-width: 0; background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: 26px; padding: 20px; display: flex; flex-direction: column; gap: 8px">
            <div style="display: flex; align-items: center; gap: 9px">
              <div style="width: 14px; height: 14px; border-radius: 999px; flex: none; background: {{ c.color }}"></div>
              <div style="font-size: 14px; font-weight: 800; letter-spacing: 0.1em; color: var(--color-neutral-400)">{{ c.pctLabel }}</div>
            </div>
            <div style="font-size: 22px; font-weight: 700; line-height: 1.15; text-wrap: pretty">{{ c.name }}</div>
            <div style="font-family: var(--font-heading); font-size: 34px; line-height: 1; color: var(--color-accent-400); margin-top: auto" data-count="money" data-dur="1600" data-to="{{ c.amount }}">$0</div>
          </div>
        </sc-for>
      </div>

      <sc-if value="{{ showImpact }}"><div key="{{ ambientKey }}" style="margin-top: auto; display: flex; align-items: center; gap: 28px; animation: afFade .6s ease both">
        <div style="position: relative; width: 158px; height: 158px; flex: none">
          <div style="position: absolute; inset: 0; border-radius: 999px; background: var(--color-accent-2-600); border: 3px solid var(--color-accent-500); display: flex; flex-direction: column; align-items: center; justify-content: center">
            <div style="font-family: var(--font-heading); font-size: 54px; line-height: 1; color: #fff" data-count="int" data-dur="1400" data-to="{{ ambientChildren }}">0</div>
            <div style="font-size: 13px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent-200)">{{ ambientUnit }}</div>
          </div>
        </div>
        <div style="min-width: 0">
          <div style="font-size: 14px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-accent-400); margin-bottom: 6px">supported for a full year</div>
          <div style="font-family: var(--font-heading); font-size: 34px; line-height: 1.08; letter-spacing: -0.015em; text-wrap: pretty">{{ ambientProgramName }}</div>
          <div style="font-size: 17px; margin-top: 8px; color: var(--color-neutral-400); text-wrap: pretty">{{ costLine }}</div>
        </div>
      </div></sc-if>
    </div>

    <div style="width: 452px; flex: none; display: flex; flex-direction: column; gap: 22px; min-height: 0">
      <div style="flex: 1; min-height: 0; background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: 28px; padding: 26px 26px 8px; display: flex; flex-direction: column; overflow: hidden">
        <div style="font-family: var(--font-heading); font-size: 30px; line-height: 1; margin-bottom: 18px; color: var(--color-accent-200)">Tonight's donors</div>
        <div ref="{{ setWallBox }}" style="position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
          <sc-for list="{{ wall }}" as="d" hint-placeholder-count="6">
            <div style="display: flex; align-items: baseline; gap: 14px; padding-bottom: 12px; border-bottom: 1px solid color-mix(in srgb, var(--color-text) 12%, transparent)">
              <div style="flex: 1; min-width: 0">
                <div style="font-size: 22px; font-weight: 700; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ d.name }}</div>
                <div style="font-size: 14px; color: var(--color-neutral-400); margin-top: 2px">{{ d.meta }}</div>
              </div>
              <div style="font-family: var(--font-heading); font-size: 26px; line-height: 1; color: var(--color-accent-400); flex: none">{{ d.amountLabel }}</div>
            </div>
          </sc-for>
          <sc-if value="{{ wallEmpty }}">
            <div style="font-size: 18px; color: var(--color-neutral-400)">The first gift of the evening goes here.</div>
          </sc-if>
        </div>
      </div>

      <sc-if value="{{ showQr }}" hint-placeholder-val="{{ true }}">
        <div style="flex: none; background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: 28px; padding: 22px; display: flex; align-items: center; gap: 20px">
          <sc-if value="{{ hasQRImage }}"><img src="{{ qrImage }}" alt="Donation QR code" style="width: 132px; height: 132px; flex: none; object-fit: contain; background: white; padding: 6px; border-radius: 12px"></sc-if>
          <sc-if value="{{ noQRImage }}"><image-slot id="gala-give-qr" style="width: 132px; height: 132px; flex: none" shape="rounded" radius="18" placeholder="Drop your QR code"></image-slot></sc-if>
          <div style="min-width: 0">
            <div style="font-family: var(--font-heading); font-size: 26px; line-height: 1.1; color: var(--color-accent-200)">Give from your seat</div>
            <div style="font-size: 17px; margin-top: 7px; color: var(--color-neutral-400); text-wrap: pretty">{{ qrCaption }}</div>
            <sc-if value="{{ donationUrl }}"><div style="font-size: 12px; overflow-wrap: anywhere; margin-top: 6px">{{ donationUrl }}</div></sc-if>
          </div>
        </div>
      </sc-if>
    </div>
  </div>

  <div style="position: absolute; right: 62px; top: 56px; bottom: 52px; width: 158px; display: flex; flex-direction: column; align-items: center; gap: 14px">
    <div style="text-align: center; min-height: 82px">
      <sc-if value="{{ showGoal }}">
        <div style="animation: afCapIn .8s cubic-bezier(.2,.8,.2,1) both" key="{{ goalTok }}">
          <div style="font-size: 13px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--color-neutral-400)">Our goal</div>
          <div style="font-family: var(--font-heading); font-size: 36px; line-height: 1.05; color: var(--color-accent-400); margin-top: 4px">{{ goalLabel }}</div>
        </div>
      </sc-if>
      <sc-if value="{{ hideGoal }}" hint-placeholder-val="{{ true }}">
        <div>
          <div style="font-size: 13px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--color-neutral-400)">Rising</div>
          <div style="font-family: var(--font-heading); font-size: 34px; line-height: 1.05; color: var(--color-accent-2-300); margin-top: 4px">tonight</div>
        </div>
      </sc-if>
    </div>

    <div style="position: relative; flex: 1; width: 104px; min-height: 0; border-radius: 999px; background: var(--color-neutral-900); border: 2px solid var(--color-divider); overflow: hidden; box-shadow: inset 0 2px 10px rgba(0,0,0,.6); animation: {{ tubeAnim }}">
      <div style="position: absolute; left: 0; right: 0; bottom: 0; border-radius: 999px; background: linear-gradient(180deg, var(--color-accent-300) 0%, var(--color-accent-500) 45%, var(--color-accent-600) 100%); box-shadow: 0 0 34px color-mix(in srgb, var(--color-accent-500) 55.00000000000001%, transparent), 0 -3px 0 rgba(255,255,255,.35) inset; transition: height 1.6s cubic-bezier(.16,.84,.24,1); height: {{ levelHeight }}"></div>
      <sc-if value="{{ sparkOn }}">
        <div style="position: absolute; inset: 0; pointer-events: none">
          <div style="position: absolute; left: 0; right: 0; bottom: 0; height: {{ levelHeight }}; background: #fff; animation: afSurge 1s ease-out both; border-radius: 999px"></div>
          <sc-for list="{{ sparks }}" as="k" hint-placeholder-count="7">
            <div style="position: absolute; bottom: {{ levelHeight }}; left: {{ k.x }}; width: {{ k.size }}; height: {{ k.size }}; border-radius: 999px; background: var(--color-accent-100); box-shadow: 0 0 12px rgba(253,243,224,.9); animation: afSpark 1.9s cubic-bezier(.3,.7,.3,1) both; animation-delay: {{ k.delay }}"></div>
          </sc-for>
        </div>
      </sc-if>
      <div style="position: absolute; left: 0; right: 0; top: 25%; height: 2px; background: color-mix(in srgb, var(--color-text) 16%, transparent)"></div>
      <div style="position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: color-mix(in srgb, var(--color-text) 22%, transparent)"></div>
      <div style="position: absolute; left: 0; right: 0; top: 75%; height: 2px; background: color-mix(in srgb, var(--color-text) 16%, transparent)"></div>
    </div>

    <div style="font-family: var(--font-heading); font-size: 30px; line-height: 1; color: var(--color-accent-300)">{{ levelPctLabel }}</div>
  </div>

  <sc-if value="{{ banner }}">
    <div style="position: absolute; left: 0; right: 236px; bottom: 0; z-index: 3; display: flex; justify-content: center; pointer-events: none">
      <div style="background: var(--color-accent-2-600); color: #fff; padding: 18px 56px 20px; border-top-left-radius: 32px; border-top-right-radius: 32px; font-family: var(--font-heading); font-size: 38px; line-height: 1; box-shadow: 0 -12px 40px rgba(0,0,0,.55); animation: afRiseSm .6s cubic-bezier(.2,.8,.2,1) both; white-space: nowrap">{{ banner }}</div>
    </div>
  </sc-if>

  <sc-if value="{{ announce }}">
    <div style="position: absolute; left: 72px; right: 800px; top: 60px; bottom: 60px; z-index: 7; display: flex; align-items: center; justify-content: center; pointer-events: none">
      <div key="{{ annKey }}" style="width: 100%; background: linear-gradient(160deg, var(--theme-card, #2a1e5e) 0%, var(--color-surface) 72%); border: 1px solid var(--color-accent-2-600); border-radius: 40px; box-shadow: 0 34px 90px rgba(0,0,0,.62); padding: 50px 54px; animation: {{ annAnim }}">
        <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap">
          <div style="font-size: 21px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; color: var(--color-accent-400)">A gift from</div>
          <sc-if value="{{ annQueue }}">
            <div style="padding: 6px 16px; border-radius: 999px; background: var(--color-accent-2-700); color: var(--color-accent-200); font-size: 15px; font-weight: 700">{{ annQueueLabel }}</div>
          </sc-if>
        </div>
        <div style="font-family: var(--font-heading); line-height: 1.03; letter-spacing: -0.02em; margin-top: 10px; color: #fff; font-size: {{ annNameSize }}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ annName }}</div>
        <div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 24px">
          <div style="padding: 12px 30px; border-radius: 999px; background: var(--color-accent-500); color: var(--on-primary, #20102f); font-family: var(--font-heading); font-size: 38px; line-height: 1">{{ annAmount }}</div>
          <sc-for list="{{ annMeta }}" as="m" hint-placeholder-count="3">
            <div style="padding: 10px 22px; border-radius: 999px; border: 2px solid var(--color-divider); font-size: 19px; font-weight: 600; color: var(--color-neutral-200)">{{ m.t }}</div>
          </sc-for>
        </div>
        <sc-if value="{{ showAnnImpact }}"><div style="display: flex; align-items: center; gap: 20px; margin-top: 28px">
          <div style="font-family: var(--font-heading); font-size: 60px; line-height: 1; color: var(--color-accent-2-300); flex: none">{{ annImpactCount }}</div>
          <div style="font-size: 25px; color: var(--color-neutral-200); text-wrap: pretty">{{ annImpactLine }}</div>
        </div></sc-if>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ goalHero }}">
    <div key="{{ goalHeroKey }}" style="position: absolute; inset: 0; z-index: 9; pointer-events: none; display: flex; align-items: center; justify-content: center">
      <div style="position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--color-accent-2-500) 50%, transparent) 0%, color-mix(in srgb, var(--color-bg) 74%, transparent) 60%, color-mix(in srgb, var(--color-bg) 84%, transparent) 100%); animation: afGoalBackdrop 2.6s cubic-bezier(.4,0,.2,1) both"></div>
      <div style="position: relative; text-align: center; animation: afGoalHero 2.6s cubic-bezier(.2,.8,.2,1) both">
        <div style="font-size: 40px; font-weight: 800; letter-spacing: 0.3em; text-transform: uppercase; color: var(--color-accent-300)">Our goal</div>
        <div style="font-family: var(--font-heading); font-size: 210px; line-height: 1; letter-spacing: -0.02em; color: var(--color-accent-500); margin-top: 10px; text-shadow: 0 0 60px color-mix(in srgb, var(--color-accent-500) 50%, transparent), 0 10px 44px rgba(0,0,0,.5)">{{ goalHeroLabel }}</div>
      </div>
    </div>
  </sc-if>

</div>
</div>
</template>
