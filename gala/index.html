<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gala Control · Aspiring Futures</title>
<link rel="icon" href="assets/aspiring-futures-logo.jpg">
<link rel="stylesheet" href="ds/fonts.css">
<link rel="stylesheet" href="ds/styles.css">
<style>
:root {
  --color-bg: #0e0b26;
  --color-surface: #1b1442;
  --color-text: #f7f4ef;
  --color-accent: #f2a93b;
  --color-accent-2: #9563dc;
  --color-divider: color-mix(in srgb, #f7f4ef 18%, transparent);
  --color-neutral-100: #f7f5fb; --color-neutral-200: #e6e1f0; --color-neutral-300: #c9c1de;
  --color-neutral-400: #a79cc4; --color-neutral-500: #8478a6; --color-neutral-600: #635886;
  --color-neutral-700: #453c63; --color-neutral-800: #2a2347; --color-neutral-900: #16102f;
  --color-accent-100: #fdf3e0; --color-accent-200: #fbe4b8; --color-accent-300: #f8ce84;
  --color-accent-400: #f5b856; --color-accent-500: #f2a93b; --color-accent-600: #d18c25;
  --color-accent-700: #a96c17; --color-accent-800: #7c4e0e; --color-accent-900: #4f3108;
  --color-accent-2-100: #f3ebfc; --color-accent-2-200: #e2d0f8; --color-accent-2-300: #c9a9f1;
  --color-accent-2-400: #ae83e8; --color-accent-2-500: #9563dc; --color-accent-2-600: #7a46c2;
  --color-accent-2-700: #5e31a0; --color-accent-2-800: #43217a; --color-accent-2-900: #2a1450;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.45);
  --shadow-md: 0 6px 18px rgba(0,0,0,.5);
  --shadow-lg: 0 18px 48px rgba(0,0,0,.6);
}
html, body { margin: 0; background: var(--color-bg); }
a { color: var(--color-accent-400); }
a:hover { color: var(--color-accent-300); }
input, select, textarea { font-family: var(--font-body); color: var(--color-text); background: var(--color-neutral-900); border: 1px solid var(--color-divider); }
input::placeholder { color: var(--color-neutral-500); }
.afin { width: 100%; box-sizing: border-box; border-radius: 999px; padding: 13px 20px; font-size: 17px; outline: none; }
.afin:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.afb { display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; font-family: var(--font-heading); font-size: 15px; border-radius: 999px; padding: 12px 22px; border: 1px solid transparent; background: transparent; color: var(--color-text); }
.afb:hover { background: rgba(247,244,239,.08) }
.afb:active { background: rgba(247,244,239,.16) }
.afb-primary { background: var(--color-accent-500); color: var(--on-primary, #20102f) }
.afb-primary:hover { background: var(--color-accent-400) }
.afb-primary:active { background: var(--color-accent-600) }
.afb-out { border-color: var(--color-divider) }
.afb-on { background: var(--color-accent-2-600); color: #fff }
.afb-on:hover { background: var(--color-accent-2-500) }
.afb:disabled { opacity: .45; cursor: not-allowed }
.aflab { display: block; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--color-neutral-400); margin-bottom: 7px }
.afrow:hover { background: rgba(247,244,239,.04) }
.af-settings-grid, .af-settings-connection-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 20px; align-items: start; }
.af-settings-connection-row { grid-column: 1 / -1; align-items: stretch; }
.af-settings-details { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 20px; align-items: start; }
.af-settings-stack { min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.af-settings-card { min-width: 0; background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: 24px; padding: 20px; font-size: 14px; line-height: 1.5; }
.af-settings-card h2 { font-family: var(--font-heading); font-size: 20px; line-height: 1.3; margin: 0 0 14px; }
.af-settings-card .afb { font-family: var(--font-body); font-size: 13px; font-weight: 600; line-height: 1.4; padding: 10px 14px; }
.af-settings-note { font-size: 13px; line-height: 1.5; color: var(--color-neutral-300); overflow-wrap: anywhere; }
.af-settings-card p.af-settings-note { margin: 12px 0; }
.af-settings-status { font-size: 14px; font-weight: 600; margin: 0 0 12px; }
.af-settings-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.af-settings-address { font-size: 14px; font-variant-numeric: tabular-nums; user-select: text; overflow-wrap: anywhere; background: var(--color-neutral-900); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; }
.af-settings-code { font-family: var(--font-heading); font-size: 36px; line-height: 1.2; letter-spacing: .3em; text-indent: .3em; white-space: nowrap; color: var(--color-accent-400); background: var(--color-neutral-900); border: 1px solid var(--color-divider); border-radius: 16px; padding: 14px 10px; text-align: center; }
.af-settings-backup { grid-column: 1 / -1; }
.af-settings-backup-body { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 20px; }
.af-settings-reset { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; border-top: 1px solid var(--color-divider); margin-top: 18px; padding-top: 16px; }
@keyframes afDrop { from { opacity: 0; transform: translateY(-14px) } to { opacity: 1; transform: none } }
</style>
<style>html, body { height: 100%; } #dc-root { min-height: 100%; }</style>
</head>
<body>
<div id="dc-root"></div>
<template id="tpl">
<div style="min-height: 100vh; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); padding: 26px 30px 60px; box-sizing: border-box">

  <div style="display: flex; align-items: center; gap: 20px; flex-wrap: wrap; padding-bottom: 22px; border-bottom: 1px solid var(--color-divider); margin-bottom: 26px">
    <sc-if value="{{ logoVisible }}"><img src="{{ logoSrc }}" alt="{{ organization }}" style="width: 70px; height: 54px; border-radius: 10px; object-fit: contain"></sc-if>
    <div style="margin-right: auto">
      <div style="font-family: var(--font-heading); font-size: 26px; line-height: 1.1">Gala Control</div>
      <div style="font-size: 14px; color: var(--color-neutral-400)">{{ organization }} · {{ savedLabel }}</div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 9px 18px; border-radius: 999px; border: 1px solid var(--color-divider)">
      <div style="width: 11px; height: 11px; border-radius: 999px; background: {{ statusColor }}"></div>
      <span style="font-size: 14px; font-weight: 600">{{ statusLabel }}</span>
    </div>
    <div style="display: flex; gap: 10px; flex-wrap: wrap">
      <button class="afb afb-out" onClick="{{ clearScreen }}">Clear screen</button>
      <button class="afb afb-out" onClick="{{ exportCsv }}">Export CSV</button>
      <button class="afb afb-on" onClick="{{ openSettings }}">Settings</button>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 26px; align-items: start">

    <div style="display: flex; flex-direction: column; gap: 22px">
      <div style="background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: 28px; padding: 24px">
        <div style="font-family: var(--font-heading); font-size: 24px; margin-bottom: 20px">New gift</div>

        <div style="display: flex; flex-direction: column; gap: 16px">
          <div>
            <span class="aflab">Donor name</span>
            <input class="afin" type="text" placeholder="e.g. The Rahman Family" value="{{ fName }}" onChange="{{ onName }}" onKeyDown="{{ onKey }}">
            <div style="display: flex; gap: 8px; margin-top: 10px">
              <button class="afb afb-out" onClick="{{ setNamed }}" style="flex: 1; background: {{ namedBg }}">Named</button>
              <button class="afb afb-out" onClick="{{ setAnon }}" style="flex: 1; background: {{ anonBg }}">Anonymous</button>
            </div>
          </div>

          <div>
            <span class="aflab">Amount ({{ currency }})</span>
            <input class="afin" type="number" inputmode="decimal" min="0" step="1" placeholder="0" value="{{ fAmount }}" onChange="{{ onAmount }}" onKeyDown="{{ onKey }}" style="font-family: var(--font-heading); font-size: 26px; padding: 14px 22px">
            <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px">
              <sc-for list="{{ quick }}" as="q" hint-placeholder-count="8">
                <button class="afb afb-out" style="padding: 8px 16px; font-size: 14px" onClick="{{ q.set }}">{{ q.label }}</button>
              </sc-for>
            </div>
          </div>

          <div style="display: flex; flex-wrap: wrap; gap: 14px">
            <sc-for list="{{ formFields }}" as="fd" hint-placeholder-count="4">
              <div style="flex: 1 1 {{ fd.basis }}; min-width: 150px">
                <span class="aflab">{{ fd.label }}</span>
                <sc-if value="{{ fd.isPlain }}" hint-placeholder-val="{{ true }}">
                  <input class="afin" type="{{ fd.inputType }}" value="{{ fd.value }}" onChange="{{ fd.onInput }}" onKeyDown="{{ onKey }}">
                </sc-if>
                <sc-if value="{{ fd.isChoice }}">
                  <div style="display: flex; gap: 8px; flex-wrap: wrap">
                    <sc-for list="{{ fd.opts }}" as="o" hint-placeholder-count="2">
                      <button class="afb afb-out" onClick="{{ o.pick }}" style="flex: 1; min-width: 96px; background: {{ o.bg }}">{{ o.label }}</button>
                    </sc-for>
                  </div>
                </sc-if>
              </div>
            </sc-for>
          </div>

          <sc-if value="{{ formError }}">
            <div style="font-size: 15px; color: var(--color-accent-300)">{{ formError }}</div>
          </sc-if>

          <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 4px">
            <button class="afb afb-primary" style="font-size: 19px; padding: 18px" onClick="{{ addAndShow }}">Add &amp; show on screen</button>
            <button class="afb afb-out" onClick="{{ addQuiet }}">Add quietly (no animation)</button>
          </div>
          <div style="font-size: 13px; color: var(--color-neutral-500)">⌘/Ctrl + Enter adds and shows. Every entry is saved locally the instant it lands.</div>
        </div>
      </div>

      <div style="background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: 28px; padding: 24px">
        <div style="font-family: var(--font-heading); font-size: 22px; margin-bottom: 16px">On screen now</div>
        <div style="font-size: 17px; color: var(--color-neutral-300); margin-bottom: 16px">{{ stageLabel }}</div>
        <div style="display: flex; gap: 10px; flex-wrap: wrap">
          <button class="afb afb-out" onClick="{{ replay }}" disabled="{{ noLast }}">Replay last gift</button>
          <button class="afb afb-out" onClick="{{ toggleHold }}" style="background: {{ holdBg }}">{{ holdLabel }}</button>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 22px">
      <div style="background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: 28px; padding: 24px">
        <div style="display: flex; flex-wrap: wrap; gap: 22px 34px; align-items: flex-end">
          <div>
            <span class="aflab">Total raised</span>
            <div style="font-family: var(--font-heading); font-size: 46px; line-height: 1; color: var(--color-accent-400)">{{ totalLabel }}</div>
          </div>
          <div>
            <span class="aflab">Gifts</span>
            <div style="font-family: var(--font-heading); font-size: 30px; line-height: 1">{{ giftCount }}</div>
          </div>
          <div>
            <span class="aflab">Paid</span>
            <div style="font-size: 21px; font-weight: 700; line-height: 1.3">{{ paidLabel }}</div>
          </div>
          <div>
            <span class="aflab">Pledged</span>
            <div style="font-size: 21px; font-weight: 700; line-height: 1.3">{{ pledgedLabel }}</div>
          </div>
          <div>
            <span class="aflab">Of goal</span>
            <div style="font-size: 21px; font-weight: 700; line-height: 1.3; color: var(--color-accent-2-300)">{{ goalPctLabel }}</div>
          </div>
        </div>
      </div>

      <div style="background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: 28px; padding: 24px 24px 10px">
        <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px">
          <div style="font-family: var(--font-heading); font-size: 24px">Log</div>
          <div style="font-size: 13px; color: var(--color-neutral-400)">newest first</div>
        </div>
        <div style="max-height: {{ logHeight }}; overflow: auto; margin: 0 -8px">
          <sc-for list="{{ log }}" as="d" hint-placeholder-count="4">
            <div class="afrow" style="display: flex; align-items: center; gap: 14px; padding: 12px 8px; border-bottom: 1px solid color-mix(in srgb, var(--color-text) 10%, transparent); border-radius: 14px; opacity: {{ d.opacity }}">
              <div style="flex: 1; min-width: 0">
                <div style="display: flex; align-items: center; gap: 8px">
                  <div style="font-size: 17px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0">{{ d.name }}</div>
                  <sc-if value="{{ d.anon }}">
                    <span class="tag tag-neutral" style="flex: none; font-size: 9px; padding: 2px 7px">Anon</span>
                  </sc-if>
                </div>
                <div style="font-size: 13px; color: var(--color-neutral-400); margin-top: 2px">{{ d.meta }}</div>
              </div>
              <div style="font-family: var(--font-heading); font-size: 22px; color: var(--color-accent-400); flex: none">{{ d.amountLabel }}</div>
              <div style="display: flex; gap: 6px; flex: none">
                <button class="afb afb-out" style="padding: 7px 14px; font-size: 13px" onClick="{{ d.show }}">Show</button>
                <button class="afb afb-out" style="padding: 7px 14px; font-size: 13px" onClick="{{ d.edit }}">Edit</button>
              </div>
            </div>
          </sc-for>
        </div>
        <sc-if value="{{ logEmpty }}">
          <div style="font-size: 16px; color: var(--color-neutral-400); padding-bottom: 16px">No gifts yet. The first one you add appears here.</div>
        </sc-if>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 22px">
      <sc-if value="{{ showPreview }}" hint-placeholder-val="{{ true }}">
        <div style="background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: 28px; padding: 24px">
          <div style="font-family: var(--font-heading); font-size: 24px; margin-bottom: 18px">Audience preview</div>
          <div style="border-radius: 20px; overflow: hidden; border: 1px solid var(--color-divider); aspect-ratio: 16 / 9; background: var(--color-bg)">
            <iframe title="Audience preview" src="audience.html#embed=1&amp;qr=0&amp;wall=4" style="width: 100%; height: 100%; border: 0; display: block"></iframe>
          </div>
          <div style="font-size: 13px; color: var(--color-neutral-500); margin-top: 12px">Live mirror of the projector window.</div>
        </div>
      </sc-if>

      <div style="background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: 28px; padding: 24px">
        <div style="font-family: var(--font-heading); font-size: 24px; margin-bottom: 6px">Celebrate</div>
        <div style="font-size: 13px; color: var(--color-neutral-500); margin-bottom: 16px; text-wrap: pretty">Play a burst on the audience screen — for a standout gift or hitting the goal.</div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
          <button class="afb afb-out" onClick="{{ fireConfetti }}">🎉 Confetti</button>
          <button class="afb afb-out" onClick="{{ fireBalloons }}">🎈 Balloons</button>
          <button class="afb afb-out" onClick="{{ fireFireworks }}">🎆 Fireworks</button>
          <button class="afb afb-primary" onClick="{{ fireBig }}">✨ Big finish</button>
        </div>
      </div>

      <div style="background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: 28px; padding: 24px">
        <div style="font-family: var(--font-heading); font-size: 24px; margin-bottom: 18px">The goal</div>
        <div style="display: flex; gap: 10px; align-items: flex-end">
          <div style="flex: 1">
            <span class="aflab">Target (USD)</span>
            <input class="afin" type="number" min="0" step="1000" value="{{ goalDraft }}" onChange="{{ onGoalDraft }}" style="font-family: var(--font-heading); font-size: 20px">
          </div>
          <button class="afb afb-primary" onClick="{{ applyGoal }}" style="padding: 14px 22px">Update</button>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 18px">
          <button class="afb afb-out" onClick="{{ toggleGoal }}" style="background: {{ goalOnBg }}">{{ goalOnLabel }}</button>
          <button class="afb afb-out" onClick="{{ toggleTotal }}" style="background: {{ totalOnBg }}">{{ totalOnLabel }}</button>
        </div>
        <div style="font-size: 13px; color: var(--color-neutral-500); margin-top: 14px">Raising the target mid-segment plays a "new goal" beat on the audience screen.</div>
      </div>


    </div>
  </div>

  <sc-if value="{{ settingsOpen }}">
    <div style="position: fixed; inset: 0; z-index: 40; background: rgba(9,7,20,.74); display: flex; align-items: flex-start; justify-content: center; padding: 36px 20px; overflow: auto" onClick="{{ closeSettings }}">
      <div role="dialog" aria-modal="true" aria-labelledby="settings-title" style="width: 100%; max-width: 1040px; box-sizing: border-box; background: var(--color-bg); border: 1px solid var(--color-divider); border-radius: 32px; padding: 28px; box-shadow: 0 18px 48px rgba(0,0,0,.6)" onClick="{{ stopClick }}">
        <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 6px">
          <div id="settings-title" style="font-family: var(--font-heading); font-size: 28px; margin-right: auto">Settings</div>
          <button class="afb afb-primary" onClick="{{ closeSettings }}">Done</button>
        </div>
        <div style="font-size: 13px; color: var(--color-neutral-400); margin-bottom: 22px">Event settings update live. Appearance changes wait until you click Apply.</div>
        <div class="af-settings-grid">
      <div class="af-settings-connection-row">
        <sc-if value="{{ isDesktop }}">
          <section class="af-settings-card" aria-labelledby="connection-title">
            <h2 id="connection-title">Connection &amp; Recovery</h2>
            <p role="status" class="af-settings-status">{{ serverLabel }}<br>{{ viewerLabel }}</p>
            <sc-if value="{{ serverError }}"><p role="alert">{{ serverError }}</p></sc-if>
            <p class="af-settings-note">Join the same Wi-Fi on both laptops. Open an address below on the projector, then enter the code shown alongside.</p>
            <sc-for list="{{ projectorUrls }}" as="item"><div class="af-settings-address">{{ item.url }}</div></sc-for>
            <sc-if value="{{ noNetwork }}"><p class="af-settings-note">No local address found. Connect to Wi-Fi, then check here again.</p></sc-if>
            <div class="af-settings-actions">
              <button class="afb afb-primary" onClick="{{ restartServer }}">Restart server</button>
              <button class="afb afb-out" onClick="{{ saveDiagnostic }}">Save diagnostic report</button>
            </div>
            <p class="af-settings-note" style="margin-bottom: 0">Restarting keeps gifts and pairing intact. Use trusted Wi-Fi: local HTTP is not encrypted. Guest Wi-Fi or your firewall may block connections.</p>
          </section>
        </sc-if>
        <section class="af-settings-card" aria-labelledby="projector-title">
          <h2 id="projector-title">The Projector Laptop</h2>
          <div class="af-settings-actions" style="margin-top: 0; margin-bottom: 16px">
            <button class="afb afb-out" onClick="{{ setPaired }}" style="flex: 1; background: {{ pairedBg }}">Second laptop</button>
            <button class="afb afb-out" onClick="{{ setLocal }}" style="flex: 1; background: {{ localBg }}">This laptop</button>
          </div>
          <sc-if value="{{ isPaired }}">
            <div>
              <span class="af-settings-note" style="display: block; margin-bottom: 8px">Enter this code on the projector laptop</span>
              <div class="af-settings-code">{{ code }}</div>
              <div class="af-settings-actions">
                <button class="afb afb-out" style="flex: 1" onClick="{{ copyLink }}">{{ copyLabel }}</button>
                <button class="afb afb-out" onClick="{{ newCode }}">New code</button>
              </div>
              <div style="display: flex; align-items: center; gap: 8px; margin-top: 16px">
                <div style="width: 9px; height: 9px; border-radius: 999px; flex: none; background: {{ brokerColor }}"></div>
                <div class="af-settings-note">{{ brokerLabel }}</div>
              </div>
              <p class="af-settings-note" style="margin-bottom: 0">A new code unpairs the projector. Only the controller laptop needs the portable app.</p>
            </div>
          </sc-if>
          <sc-if value="{{ isLocal }}" hint-placeholder-val="{{ true }}">
            <div>
              <button class="afb afb-primary" style="width: 100%" onClick="{{ openDisplay }}">Open audience window</button>
              <p class="af-settings-note">Move the audience window onto your projector and use fullscreen. Keep both windows open.</p>
            </div>
          </sc-if>
        </section>
      </div>
      <section class="af-settings-card af-settings-backup" aria-labelledby="backup-title">
        <h2 id="backup-title">Backup</h2>
        <div class="af-settings-backup-body">
          <div>
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 10px">
              <div style="width: 9px; height: 9px; border-radius: 999px; flex: none; background: {{ backupStatusColor }}"></div>
              <div role="status" style="font-size: 14px; font-weight: 700; color: {{ backupStatusColor }}">{{ backupStatus }}</div>
            </div>
            <p class="af-settings-note" style="margin: 0">{{ backupLine }}</p>
          </div>
          <div class="af-settings-actions" style="margin-top: 0; align-content: start">
            <button class="afb afb-out" onClick="{{ exportEvent }}">Export event</button>
            <sc-if value="{{ isDesktop }}">
              <button class="afb afb-out" onClick="{{ importEvent }}">Import event</button>
              <button class="afb afb-out" onClick="{{ openData }}">Open backup folder</button>
              <button class="afb afb-out" onClick="{{ retrySave }}">Retry saving</button>
            </sc-if>
            <sc-if value="{{ showBackupBtn }}"><button class="afb afb-primary" onClick="{{ backupAction }}">{{ backupBtnLabel }}</button></sc-if>
            <sc-if value="{{ hasBackup }}"><button class="afb afb-out" onClick="{{ stopBackup }}">Stop backing up to the file</button></sc-if>
            <button class="afb afb-out" onClick="{{ exportCsv }}">Export a CSV copy now</button>
            <label class="afb afb-out" style="cursor: pointer">Restore from CSV
              <input type="file" accept=".csv,text/csv" onChange="{{ onRestore }}" style="display: none">
            </label>
          </div>
        </div>
        <sc-if value="{{ restoreNote }}"><div role="status" class="af-settings-note" style="color: var(--color-accent-300); margin-top: 14px; animation: afDrop .4s ease both">{{ restoreNote }}</div></sc-if>
        <div class="af-settings-reset">
          <p class="af-settings-note" style="margin: 0">Finished an event? Clear the board and start a fresh CSV file for the next one.</p>
          <button class="afb afb-out" onClick="{{ askReset }}" style="color: var(--color-accent-300); border-color: color-mix(in srgb, var(--color-accent-300) 45%, transparent)">Start a new event…</button>
        </div>
      </section>
      <section style="grid-column: 1 / -1; background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: 28px; padding: 24px">
        <h2 style="font-size: 24px; margin-bottom: 8px">Brand &amp; appearance</h2>
        <p style="color: var(--color-neutral-300); font-size: 14px">Preview your changes here. The live audience changes only when you click Apply appearance.</p>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 22px">
          <div style="display: flex; flex-direction: column; gap: 14px">
            <label><span class="aflab">Organization name</span><input class="afin" type="text" maxlength="80" value="{{ brandOrganization }}" onChange="{{ onBrandOrganization }}"></label>
            <label><span class="aflab">Logo (PNG, JPG, WebP)</span><input type="file" accept="image/png,image/jpeg,image/webp" onChange="{{ onBrandLogo }}"></label>
            <button class="afb afb-out" onClick="{{ removeLogo }}">Remove logo</button>
            <div style="display: flex; gap: 8px; flex-wrap: wrap"><sc-for list="{{ brandPresets }}" as="preset"><button class="afb afb-out" onClick="{{ preset.pick }}">{{ preset.name }}</button></sc-for></div>
            <div style="display: flex; gap: 20px; flex-wrap: wrap">
              <label><span class="aflab">Primary color</span><input aria-label="Primary color" type="color" value="{{ brandPrimary }}" onChange="{{ onBrandPrimary }}"></label>
              <label><span class="aflab">Accent color</span><input aria-label="Accent color" type="color" value="{{ brandAccent }}" onChange="{{ onBrandAccent }}"></label>
              <label><span class="aflab">Background</span><input aria-label="Background color" type="color" value="{{ brandBackground }}" onChange="{{ onBrandBackground }}"></label>
            </div>
            <label><span class="aflab">Type style</span><select class="afin" value="{{ brandFont }}" onChange="{{ onBrandFont }}"><option value="modern">Modern</option><option value="rounded">Rounded</option><option value="classic">Classic</option></select></label>
            <label><span class="aflab">Event currency</span><select class="afin" value="{{ brandCurrency }}" onChange="{{ onBrandCurrency }}"><option value="USD">USD — US dollar</option><option value="CAD">CAD — Canadian dollar</option><option value="GBP">GBP — British pound</option><option value="EUR">EUR — Euro</option><option value="AUD">AUD — Australian dollar</option><option value="PKR">PKR — Pakistani rupee</option><option value="INR">INR — Indian rupee</option></select></label>
            <small>Currency changes labels only; it does not convert existing amounts.</small>
          </div>
          <div style="display: flex; flex-direction: column; gap: 14px">
            <div aria-label="Brand preview" style="min-height: 210px; padding: 26px; border-radius: 24px; background: {{ brandBackground }}; color: {{ brandPreviewText }}; border: 2px solid {{ brandAccent }}">
              <img src="{{ brandLogo }}" alt="Logo preview" style="height: 55px; max-width: 160px; object-fit: contain; margin-bottom: 16px">
              <div style="font-family: {{ brandPreviewFont }}; font-weight: 700; font-size: 26px; overflow-wrap: anywhere">{{ brandOrganization }}</div>
              <div style="font-size: 40px; color: {{ brandPrimary }}; font-weight: 700; margin: 12px 0">{{ brandPreviewAmount }}</div>
              <div style="height: 9px; width: 70%; border-radius: 8px; background: {{ brandAccent }}"></div>
            </div>
            <small role="status">{{ brandContrast }}</small>
            <label><span class="aflab">Message when total is hidden</span><input class="afin" maxlength="180" value="{{ brandMessage }}" onChange="{{ onBrandMessage }}"></label>
            <label><input type="checkbox" checked="{{ brandImpact }}" onChange="{{ onBrandImpact }}"> Show program impact calculations</label>
            <label><span class="aflab">Donation website (optional)</span><input class="afin" type="url" placeholder="https://example.org/donate" value="{{ brandDonationUrl }}" onChange="{{ onBrandDonationUrl }}"></label>
            <label><span class="aflab">Donation QR image</span><input type="file" accept="image/png,image/jpeg,image/webp" onChange="{{ onBrandQR }}"></label>
            <small>Upload the QR image provided by your donation platform. It will be shared with the projector. Online donation pages still need internet.</small>
            <button class="afb afb-out" onClick="{{ removeQR }}">Remove QR image</button>
          </div>
        </div>
        <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px">
          <button class="afb afb-primary" onClick="{{ applyBrand }}">Apply appearance</button>
          <button class="afb afb-out" onClick="{{ discardBrand }}">Discard changes</button>
          <button class="afb afb-out" onClick="{{ defaultBrand }}">Restore theme defaults</button>
        </div>
        <div role="status" style="margin-top: 12px">{{ brandNote }}</div>
      </section>
      <div class="af-settings-details">
        <div class="af-settings-stack">
      <div style="background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: 28px; padding: 24px">
        <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px">
          <div style="font-family: var(--font-heading); font-size: 24px">Where it goes</div>
          <div style="font-size: 14px; font-weight: 700; color: {{ sumColor }}">{{ sumLabel }}</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px">
          <sc-for list="{{ catRows }}" as="c" hint-placeholder-count="4">
            <div style="padding-bottom: 14px; border-bottom: 1px solid var(--color-divider)">
              <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px">
                <div style="width: 13px; height: 13px; border-radius: 999px; flex: none; background: {{ c.color }}"></div>
                <input class="afin" type="text" aria-label="Program name" value="{{ c.name }}" onChange="{{ c.onName }}" style="flex: 1; min-width: 0; padding: 10px 12px; font-size: 15px">
                <button class="afb" style="padding: 8px 10px; font-size: 13px; color: var(--color-neutral-400); flex: none" onClick="{{ c.remove }}">Remove</button>
              </div>
              <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; font-size: 12px; color: var(--color-neutral-400)">
                <label>Share %<input class="afin" type="number" min="0" step="1" value="{{ c.pct }}" onChange="{{ c.onPct }}" style="width: 100%; margin-top: 5px; padding: 10px 8px; font-size: 15px"></label>
                <label>Cost / month<input class="afin" type="number" min="0" step="5" value="{{ c.monthly }}" onChange="{{ c.onMonthly }}" style="width: 100%; margin-top: 5px; padding: 10px 8px; font-size: 15px"></label>
                <label>Program unit<input class="afin" type="text" placeholder="people" value="{{ c.unit }}" onChange="{{ c.onUnit }}" style="width: 100%; margin-top: 5px; padding: 10px 8px; font-size: 15px" title="Unit, such as people, families or animals"></label>
              </div>
            </div>
          </sc-for>
        </div>
        <div style="font-size: 13px; color: var(--color-neutral-500); margin-top: 14px; text-wrap: pretty">Share % splits the money between programs; the monthly cost sets how many people each supports for a year on the audience screen.</div>
        <div style="display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap">
          <button class="afb afb-out" onClick="{{ addCat }}">Add program</button>
          <button class="afb afb-out" onClick="{{ normalize }}">Normalize to 100</button>
        </div>
      </div>
      <div style="background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: 28px; padding: 24px">
        <div style="font-family: var(--font-heading); font-size: 24px; margin-bottom: 18px">Screen &amp; wording</div>
        <div style="display: flex; flex-direction: column; gap: 16px">
          <div>
            <span class="aflab">Event name</span>
            <input class="afin" type="text" value="{{ eventName }}" onChange="{{ onEventName }}">
          </div>
          <div>
            <span class="aflab">Tagline</span>
            <input class="afin" type="text" value="{{ tagline }}" onChange="{{ onTagline }}">
          </div>
          <div>
            <span class="aflab">Give-from-your-seat caption</span>
            <input class="afin" type="text" value="{{ qrCaption }}" onChange="{{ onQrCaption }}">
          </div>
          <div>
            <label><span class="aflab">Anonymous donor wording</span>
              <input class="afin" type="text" maxlength="160" placeholder="A friend of {organization name}" value="{{ anonymousLabel }}" onChange="{{ onAnonymousLabel }}" aria-describedby="anonymous-wording-help">
            </label>
            <div id="anonymous-wording-help" class="af-settings-note" style="margin-top: 8px">Use {organization name} to insert your organization's name. Changes update live; leaving this blank uses the default.</div>
            <div class="af-settings-note" style="margin-top: 8px">On screen: <span>{{ anonymousPreview }}</span></div>
            <button class="afb afb-out" style="margin-top: 10px; padding: 8px 14px; font-size: 13px" onClick="{{ resetAnonymousLabel }}">Use default wording</button>
          </div>
          <div>
            <span class="aflab">Animation pace</span>
            <div style="display: flex; gap: 6px">
              <sc-for list="{{ paces }}" as="p" hint-placeholder-count="3">
                <button class="afb afb-out" style="flex: 1; padding: 12px 10px; font-size: 13px; background: {{ p.bg }}" onClick="{{ p.set }}">{{ p.label }}</button>
              </sc-for>
            </div>
          </div>
        </div>
      </div>
        </div>
      <div style="background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: 28px; padding: 24px">
        <div style="font-family: var(--font-heading); font-size: 24px; margin-bottom: 6px">Gift fields</div>
        <div style="font-size: 13px; color: var(--color-neutral-500); margin-bottom: 18px; text-wrap: pretty">{{ screenNote }}</div>
        <div style="display: flex; flex-direction: column; gap: 14px">
          <sc-for list="{{ fieldRows }}" as="fd" hint-placeholder-count="4">
            <div style="border: 1px solid var(--color-divider); border-radius: 20px; padding: 14px">
              <div style="display: flex; gap: 8px; align-items: center">
                <input class="afin" type="text" value="{{ fd.label }}" onChange="{{ fd.onLabel }}" style="flex: 1; min-width: 0; padding: 10px 16px; font-size: 15px">
                <button class="afb afb-out" style="padding: 9px 14px; font-size: 13px; flex: none" onClick="{{ fd.cycleType }}">{{ fd.typeLabel }}</button>
              </div>
              <sc-if value="{{ fd.isChoice }}">
                <input class="afin" type="text" value="{{ fd.optionsText }}" onChange="{{ fd.onOptions }}" placeholder="Paid, Pledged" style="margin-top: 8px; padding: 9px 16px; font-size: 14px">
              </sc-if>
              <div style="display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap">
                <button class="afb afb-out" style="padding: 8px 14px; font-size: 13px; background: {{ fd.onScreenBg }}" onClick="{{ fd.toggleScreen }}">{{ fd.onScreenLabel }}</button>
                <button class="afb afb-out" style="padding: 8px 14px; font-size: 13px; background: {{ fd.wideBg }}" onClick="{{ fd.toggleWide }}">Full width</button>
                <button class="afb" style="padding: 8px 12px; font-size: 13px; color: var(--color-neutral-400); margin-left: auto" onClick="{{ fd.remove }}">Remove</button>
              </div>
            </div>
          </sc-for>
        </div>
        <button class="afb afb-out" style="margin-top: 16px" onClick="{{ addField }}">Add field</button>
      </div>
      </div>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ confirmReset }}">
    <div style="position: fixed; inset: 0; z-index: 60; background: rgba(9,7,20,.8); display: flex; align-items: center; justify-content: center; padding: 24px" onClick="{{ cancelReset }}">
      <div style="width: 100%; max-width: 460px; background: var(--color-bg); border: 1px solid var(--color-divider); border-radius: 28px; padding: 28px; box-shadow: 0 18px 48px rgba(0,0,0,.6)" onClick="{{ stopClick }}">
        <div style="font-family: var(--font-heading); font-size: 26px; margin-bottom: 10px">Start a new event?</div>
        <div style="font-size: 15px; color: var(--color-neutral-300); text-wrap: pretty; line-height: 1.5">This clears all {{ giftCountAll }} gifts and the board, and starts a fresh CSV file. Your categories, fields and wording stay. This can’t be undone — export a CSV first if you want a copy.</div>
        <div style="display: flex; gap: 10px; margin-top: 24px; justify-content: flex-end">
          <button class="afb afb-out" onClick="{{ cancelReset }}">Cancel</button>
          <button class="afb afb-primary" onClick="{{ doReset }}" style="background: var(--color-accent-300)">Start a new event</button>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ editOpen }}">
    <div style="position: fixed; inset: 0; z-index: 60; background: rgba(9,7,20,.8); display: flex; align-items: flex-start; justify-content: center; padding: 36px 20px; overflow: auto" onClick="{{ closeEdit }}">
      <div style="width: 100%; max-width: 540px; background: var(--color-bg); border: 1px solid var(--color-divider); border-radius: 28px; padding: 28px; box-shadow: 0 18px 48px rgba(0,0,0,.6)" onClick="{{ stopClick }}">
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 20px">
          <div style="font-family: var(--font-heading); font-size: 26px; margin-right: auto">Edit gift</div>
          <button class="afb afb-out" onClick="{{ closeEdit }}">Cancel</button>
          <button class="afb afb-primary" onClick="{{ saveEdit }}">Save changes</button>
        </div>
        <div style="display: flex; flex-direction: column; gap: 16px">
          <div>
            <span class="aflab">Donor name</span>
            <input class="afin" type="text" placeholder="e.g. The Rahman Family" value="{{ efName }}" onChange="{{ onEditName }}">
            <div style="display: flex; gap: 8px; margin-top: 10px">
              <button class="afb afb-out" onClick="{{ setEditNamed }}" style="flex: 1; background: {{ editNamedBg }}">Named</button>
              <button class="afb afb-out" onClick="{{ setEditAnon }}" style="flex: 1; background: {{ editAnonBg }}">Anonymous</button>
            </div>
          </div>

          <div>
            <span class="aflab">Amount (USD)</span>
            <input class="afin" type="number" inputmode="decimal" min="0" step="1" placeholder="0" value="{{ efAmount }}" onChange="{{ onEditAmount }}" style="font-family: var(--font-heading); font-size: 24px; padding: 12px 20px">
            <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px">
              <sc-for list="{{ editQuick }}" as="q" hint-placeholder-count="8">
                <button class="afb afb-out" style="padding: 8px 16px; font-size: 14px" onClick="{{ q.set }}">{{ q.label }}</button>
              </sc-for>
            </div>
          </div>

          <div style="display: flex; flex-wrap: wrap; gap: 14px">
            <sc-for list="{{ editFields }}" as="fd" hint-placeholder-count="4">
              <div style="flex: 1 1 {{ fd.basis }}; min-width: 150px">
                <span class="aflab">{{ fd.label }}</span>
                <sc-if value="{{ fd.isPlain }}" hint-placeholder-val="{{ true }}">
                  <input class="afin" type="{{ fd.inputType }}" value="{{ fd.value }}" onChange="{{ fd.onInput }}">
                </sc-if>
                <sc-if value="{{ fd.isChoice }}">
                  <div style="display: flex; gap: 8px; flex-wrap: wrap">
                    <sc-for list="{{ fd.opts }}" as="o" hint-placeholder-count="2">
                      <button class="afb afb-out" onClick="{{ o.pick }}" style="flex: 1; min-width: 96px; background: {{ o.bg }}">{{ o.label }}</button>
                    </sc-for>
                  </div>
                </sc-if>
              </div>
            </sc-for>
          </div>

          <sc-if value="{{ editErr }}">
            <div style="font-size: 15px; color: var(--color-accent-300)">{{ editErr }}</div>
          </sc-if>

          <div style="height: 1px; background: var(--color-divider); margin: 4px 0"></div>
          <div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap">
            <button class="afb afb-out" onClick="{{ toggleEditVoid }}" style="background: {{ editVoidBg }}; color: {{ editVoidColor }}; border-color: color-mix(in srgb, var(--color-accent-300) 45%, transparent)">{{ editVoidLabel }}</button>
            <div style="font-size: 13px; color: var(--color-neutral-500); flex: 1; min-width: 180px; text-wrap: pretty">Voided gifts drop out of the totals and the audience screen, but stay in the CSV.</div>
          </div>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</template>
<script src="js/branding.js"></script>
<script src="js/gala-link.js"></script>
<script src="js/lan-link.js"></script>
<script src="js/dcx.js"></script>
<script src="js/controller-settings.js"></script>
<script src="js/controller.js"></script>
</body>
</html>
